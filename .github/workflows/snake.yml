name: Generate Snake Animation

on:
  # schedule:
  #   - cron: "0 0 * * *"
  # workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23333333&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%238E3B2F
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23333333&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%238E3B2F

      - name: Push snake svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
